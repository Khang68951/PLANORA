services:
  postgres:
    image: postgres:17-alpine
    container_name: planora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: planora
      POSTGRES_USER: planora
      POSTGRES_PASSWORD: planora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - planora-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planora -d planora"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  planora-data:
